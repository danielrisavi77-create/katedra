name: V2-001 bootstrap

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'feature/katedra-v2-001-test-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate Vitest lockfile
        run: |
          npm pkg set scripts.test='vitest run'
          npm pkg set scripts.test:watch='vitest'
          npm install --save-dev vitest@4.1.10
      - name: Commit npm-generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile changes needed.'
            exit 0
          fi
          git commit -m 'test: add Vitest foundation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
