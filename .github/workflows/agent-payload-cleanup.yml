name: Agent temporary payload cleanup

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLEANUP_URL: ${{ vars.KATEDRA_AGENT_PAYLOAD_CLEANUP_URL }}
      CLEANUP_SECRET: ${{ secrets.KATEDRA_AGENT_PAYLOAD_CLEANUP_CRON_SECRET }}
    steps:
      - name: Require cleanup configuration
        run: |
          missing=0
          for name in CLEANUP_URL CLEANUP_SECRET; do
            if [ -z "${!name}" ]; then
              echo "$name is required for temporary payload cleanup."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Delete expired and terminal run payloads
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 \
            --request POST "$CLEANUP_URL" \
            --header "Authorization: Bearer $CLEANUP_SECRET" \
            --header 'Content-Type: application/json'
