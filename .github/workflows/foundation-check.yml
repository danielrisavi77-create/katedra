name: Foundation check

on:
  push:
    branches:
      - master
      - architecture/lekta-katedra-foundation-v0.1
  pull_request:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run typecheck:strict
      - run: npm run lint
      - run: npm run build
